# Render Blueprint — deploys the whole platform as one web service + Postgres.
# Express serves the API at /api and the built React app for every other path.
# Deploy: Render Dashboard → New → Blueprint → select this repo.

databases:
  - name: mandap-db
    plan: free
    databaseName: mandap_booking
    user: mandap

services:
  - type: web
    name: mandap-booking
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npx prisma generate
    # Schema is synced with `db push` (the committed migration predates the schema).
    # Both seed scripts are idempotent, so they are safe to run on every start.
    startCommand: >-
      cd backend && npx prisma db push --skip-generate &&
      node prisma/seed.js && node seed-demo.js && node src/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mandap-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PLATFORM_COMMISSION_PERCENT
        value: "10"
      - key: ADVANCE_PAYMENT_PERCENT
        value: "30"
      - key: BOOKING_HOLD_MINUTES
        value: "30"
      # Optional integrations — fill in on the Render dashboard when ready
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
