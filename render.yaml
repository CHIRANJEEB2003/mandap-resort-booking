# Render Blueprint — deploys the whole platform as one web service.
# Express serves the API at /api and the built React app for every other path.
# The database is MongoDB (e.g. MongoDB Atlas free M0 cluster, which is a replica
# set as Prisma requires). Render prompts for DATABASE_URL when the Blueprint is created.
# Deploy: Render Dashboard → New → Blueprint → select this repo.

services:
  - type: web
    name: mandap-booking
    runtime: node
    plan: free
    healthCheckPath: /health
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npx prisma generate
    # MongoDB has no migrations: `db push` creates collections + indexes, then
    # ensure-indexes adds the partial unique email index. Seeds are idempotent.
    startCommand: >-
      cd backend && npx prisma db push --skip-generate &&
      node prisma/ensure-indexes.js && node prisma/seed.js &&
      node seed-demo.js && node src/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # MongoDB connection string, e.g. mongodb+srv://USER:PASS@cluster0.xxxx.mongodb.net/mandap_booking
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PLATFORM_COMMISSION_PERCENT
        value: "10"
      - key: ADVANCE_PAYMENT_PERCENT
        value: "30"
      - key: BOOKING_HOLD_MINUTES
        value: "30"
      # Optional integrations — fill in on the Render dashboard when ready
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
