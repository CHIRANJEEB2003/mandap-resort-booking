version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mandap_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mandap_booking
      POSTGRES_USER: mandap
      POSTGRES_PASSWORD: mandap_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: mandap_backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: mandap_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
